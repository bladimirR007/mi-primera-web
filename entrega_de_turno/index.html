<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF a Excel - Historia Clínica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2rem; color: #333; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 1rem; }

        /* Campo funcionario */
        .funcionario-box {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .funcionario-box label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .funcionario-box input {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .funcionario-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #ebf4ff;
            transform: translateY(-2px);
        }

        .upload-content svg { color: #667eea; margin-bottom: 15px; }
        .upload-content p { font-size: 1.1rem; margin-bottom: 8px; color: #4a5568; }
        .hint { color: #a0aec0; font-size: 0.9rem; }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-success, .btn-secondary {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { background: #cbd5e0; cursor: not-allowed; transform: none; }

        .btn-success { background: #48bb78; color: white; }
        .btn-success:hover { background: #38a169; transform: translateY(-2px); }

        .btn-secondary { background: #edf2f7; color: #4a5568; }
        .btn-secondary:hover { background: #e2e8f0; }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status.info { background: #ebf8ff; color: #2c5282; display: block; }
        .status.success { background: #f0fff4; color: #22543d; display: block; }
        .status.error { background: #fff5f5; color: #742a2a; display: block; }

        .preview { margin-top: 30px; }
        .preview h2 { margin-bottom: 15px; color: #2d3748; }

        .table-wrapper {
            overflow: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        table th, table td { padding: 12px 14px; border: 1px solid #e2e8f0; text-align: left; }
        table th { 
            background: #667eea; 
            color: white; 
            font-weight: 600; 
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        table tr:nth-child(even) { background: #f7fafc; }
        table td { font-weight: 500; color: #2d3748; }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .missing { color: #cbd5e0; font-style: italic; font-weight: 400; }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .actions { flex-direction: column; }
            .actions button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 → 📊 Historia Clínica a Excel</h1>
            <p class="subtitle">Extrae y organiza los datos de la HC para tu Excel maestro</p>
        </header>

        <!-- Campo funcionario -->
        <div class="funcionario-box">
            <label for="funcionarioInput">👤 FUNCIONARIO:</label>
            <input 
                type="text" 
                id="funcionarioInput" 
                placeholder="Escribe tu nombre completo..."
                autocomplete="off"
            >
        </div>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="pdfInput" accept="application/pdf" hidden>
            <div class="upload-content">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p><strong>Haz clic</strong> o arrastra un PDF aquí</p>
                <span class="hint">Solo archivos .pdf</span>
            </div>
        </div>

        <div class="controls" id="controls" style="display:none;">
            <button id="convertBtn" class="btn-primary">🔍 Extraer datos</button>
        </div>

        <div class="status" id="status"></div>

        <div class="preview" id="preview" style="display:none;">
            <h2>Vista previa</h2>
            <div class="table-wrapper">
                <table id="previewTable"></table>
            </div>
            <div class="actions">
                <button id="downloadBtn" class="btn-success">⬇️ Descargar Excel</button>
                <button id="copyBtn" class="btn-secondary">📋 Copiar fila</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const uploadArea = document.getElementById('uploadArea');
        const pdfInput = document.getElementById('pdfInput');
        const controls = document.getElementById('controls');
        const convertBtn = document.getElementById('convertBtn');
        const statusEl = document.getElementById('status');
        const preview = document.getElementById('preview');
        const previewTable = document.getElementById('previewTable');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const funcionarioInput = document.getElementById('funcionarioInput');

        let currentPdf = null;
        let extractedData = null;

        // ============ PERSISTIR FUNCIONARIO EN EL NAVEGADOR ============
        const FUNC_KEY = 'funcionario_nombre';
        funcionarioInput.value = localStorage.getItem(FUNC_KEY) || '';
        funcionarioInput.addEventListener('input', () => {
            localStorage.setItem(FUNC_KEY, funcionarioInput.value);
        });

        // ============ EVENTOS ============
        uploadArea.addEventListener('click', () => pdfInput.click());
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') handleFile(file);
            else showStatus('Por favor, sube un archivo PDF válido', 'error');
        });
        pdfInput.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

        convertBtn.addEventListener('click', extraerDatos);
        downloadBtn.addEventListener('click', downloadExcel);
        copyBtn.addEventListener('click', copyToClipboard);

        // ============ CARGA ============
        async function handleFile(file) {
            showStatus('Cargando PDF...', 'info');
            try {
                const arrayBuffer = await file.arrayBuffer();
                currentPdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                showStatus(`✅ PDF cargado: ${currentPdf.numPages} página(s)`, 'success');
                controls.style.display = 'flex';
                preview.style.display = 'none';
            } catch (err) {
                console.error(err);
                showStatus('Error al cargar el PDF: ' + err.message, 'error');
            }
        }

        // ============ EXTRAER TEXTO ============
        async function extraerTextoCompleto() {
            let texto = '';
            for (let pageNum = 1; pageNum <= currentPdf.numPages; pageNum++) {
                const page = await currentPdf.getPage(pageNum);
                const content = await page.getTextContent();
                texto += content.items.map(i => i.str).join(' ') + '\n';
            }
            return texto;
        }

        // ============ SEPARAR NOMBRE Y APELLIDO ============
        function separarNombreApellido(nombreCompleto) {
            const partes = nombreCompleto.toUpperCase()
                .replace(/\s+/g, ' ')
                .trim()
                .split(' ')
                .filter(p => p.length > 0);

            if (partes.length === 0) return { nombre: '', apellido: '' };
            if (partes.length === 1) return { nombre: partes[0], apellido: '' };
            if (partes.length === 2) return { nombre: partes[0], apellido: partes[1] };
            if (partes.length === 3) return { nombre: partes.slice(0, 2).join(' '), apellido: partes[2] };
            
            // 4 o más: 2 nombres + resto apellidos (formato colombiano típico)
            return {
                nombre: partes.slice(0, 2).join(' '),
                apellido: partes.slice(2).join(' ')
            };
        }

        // ============ EXTRAER LOS CAMPOS ============
        function extraerCampos(texto) {
            const t = texto.replace(/[ \t]+/g, ' ');
            
            const datos = {
                'FUNCIONARIO': (funcionarioInput.value || '').trim().toUpperCase() || 'NO ESPECIFICADO',
                'FECHA': '',
                'HORA': '',
                'NOMBRE': '',
                'APELLIDO': '',
                'TIPO DE DOCUMENTO': '',
                'NUMERO DE DOCUMENTO': '',
                'EDAD': '',
                'EPS': '',
                'TIPO DE TRAMITE': '',
                'SERVICIO REQUERIDO': ''
            };

            // ---------- NOMBRE COMPLETO ----------
            let nombreCompleto = '';
            const matchHeader = t.match(
                /HISTORIA\s+CL[ÍI]NICA\s+No\.?\s*CC\s*\d+\s*[-–—]+\s*([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ\s]+?)(?=\s+(?:Empresa|EMPRESA|Fecha|FECHA|Afiliado|AFILIADO|$))/i
            );
            if (matchHeader) nombreCompleto = matchHeader[1].trim().replace(/\s+/g, ' ');

            if (!nombreCompleto) {
                const matchAlt = t.match(/Nombre\s+Completo\s*:?\s*([A-Za-zÁÉÍÓÚÑáéíóúñ\s]+?)(?=\s+(?:Documento|Fecha|Edad|Sexo|$))/i);
                if (matchAlt) nombreCompleto = matchAlt[1].trim().replace(/\s+/g, ' ').toUpperCase();
            }

            if (nombreCompleto) {
                const { nombre, apellido } = separarNombreApellido(nombreCompleto);
                datos['NOMBRE'] = nombre;
                datos['APELLIDO'] = apellido;
            }

            // ---------- TIPO Y NÚMERO DE DOCUMENTO ----------
            const matchCC = t.match(/\b(CC|TI|RC|CE|PA|MS|AS|PE|PT)\s*(\d{6,12})\b/);
            if (matchCC) {
                datos['TIPO DE DOCUMENTO'] = matchCC[1].toUpperCase();
                datos['NUMERO DE DOCUMENTO'] = matchCC[2];
            } else {
                const matchDoc = t.match(/Documento\s+De\s+Identidad\s*:?\s*(\d{6,12})/i);
                if (matchDoc) {
                    datos['NUMERO DE DOCUMENTO'] = matchDoc[1];
                    datos['TIPO DE DOCUMENTO'] = 'CC';
                }
            }

            // ---------- EDAD ----------
            const matchEdad = t.match(/Edad\s*(?:actual)?\s*:?\s*(\d{1,3})\s*(?:A[ÑN]OS|Años)/i);
            if (matchEdad) datos['EDAD'] = matchEdad[1];

            // ---------- EPS ----------
            let eps = '';
            const matchEPS = t.match(/Empresa\s*:?\s*(EPS\s+[A-Za-záéíóúñ\s]+?)(?=\s*['"]|\s+(?:Afiliado|Fecha|Fecha\s*Nac|$))/i);
            if (matchEPS) eps = matchEPS[1].trim();

            if (!eps) {
                const matchAseg = t.match(/Aseguradora\s*:?\s*([A-Za-záéíóúñ\s]+?)(?=\s+(?:Motivo|Enfermedad|Fecha|$))/i);
                if (matchAseg) eps = matchAseg[1].trim();
            }

            if (eps) {
                eps = eps.replace(/['"*\(\)]/g, '')
                         .replace(/\bU\b/g, '')
                         .replace(/\bC\b/g, '')
                         .replace(/\s+/g, ' ')
                         .trim()
                         .toUpperCase();
                datos['EPS'] = eps;
            }

            // ---------- FECHA Y HORA ----------
            // Patrón: "FOLIO 100 FECHA17/09/2026 14:05:51 TIPO DE ATENCIÓN URGENCIAS"
            // O: "FECHA17/09/2026 14:05:51"
            // Nota: la fecha puede venir sin espacio después de "FECHA"
            const matchFecha = t.match(/FECHA\s*:?\s*(\d{2}\/\d{2}\/\d{2,4})\s+(\d{2}:\d{2}(?::\d{2})?)/i);
            if (matchFecha) {
                datos['FECHA'] = matchFecha[1];
                datos['HORA'] = matchFecha[2];
            } else {
                // Solo fecha
                const matchSoloFecha = t.match(/FECHA\s*:?\s*(\d{2}\/\d{2}\/\d{2,4})/i);
                if (matchSoloFecha) datos['FECHA'] = matchSoloFecha[1];
                
                // Solo hora
                const matchSoloHora = t.match(/(\d{2}:\d{2}(?::\d{2})?)/);
                if (matchSoloHora) datos['HORA'] = matchSoloHora[1];
            }

            // ---------- TIPO DE TRAMITE ----------
            // Buscar "TIPO DE ATENCIÓN URGENCIAS" / "TIPO DE ATENCIÓN HOSPITALIZACION"
            const matchTramite = t.match(/TIPO\s*DE\s*ATENCI[OÓ]N\s*:?\s*([A-ZÁÉÍÓÚÑ]+)/i);
            if (matchTramite) {
                datos['TIPO DE TRAMITE'] = matchTramite[1].toUpperCase();
            }

            // ---------- SERVICIO REQUERIDO (ESPECIALIDAD DE REMISIÓN) ----------
            const patronesEsp = [
                /remisi[oó]n\s+(?:por|a|para)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[a-záéíóúñ]+)?)/i,
                /remitir\s+a\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)/i,
                /remision\s+por\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)/i,
                /solicita\s+valoraci[oó]n\s+por\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[a-záéíóúñ]+)?)/i,
                /interconsulta\s+(?:por|con)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[a-záéíóúñ]+)?)/i,
                /interconsulta\s+por\s*([A-ZÁÉÍÓÚÑ][A-Za-záéíóúñ\s]+?)\s*\(/i
            ];
            
            for (const p of patronesEsp) {
                const m = t.match(p);
                if (m && m[1]) {
                    datos['SERVICIO REQUERIDO'] = m[1].trim().toUpperCase();
                    break;
                }
            }

            // Si no se encontró remisión, buscar "interconsulta por medicina familiar"
            if (!datos['SERVICIO REQUERIDO']) {
                const matchInter = t.match(/INTERCONSULTA\s+POR\s*([A-ZÁÉÍÓÚÑ][A-Za-záéíóúñ\s]+?)(?=\s*\(|$)/i);
                if (matchInter) {
                    datos['SERVICIO REQUERIDO'] = matchInter[1].trim().toUpperCase();
                }
            }

            return datos;
        }

        // ============ EXTRAER Y MOSTRAR ============
        async function extraerDatos() {
            if (!currentPdf) return;
            
            // Validar funcionario
            if (!funcionarioInput.value.trim()) {
                showStatus('⚠️ Por favor escribe el nombre del FUNCIONARIO antes de continuar', 'error');
                funcionarioInput.focus();
                return;
            }
            
            convertBtn.disabled = true;
            convertBtn.textContent = 'Procesando...';
            showStatus('Extrayendo datos del PDF...', 'info');

            try {
                const texto = await extraerTextoCompleto();
                extractedData = extraerCampos(texto);

                const camposOK = Object.values(extractedData).filter(v => v && v.trim() !== '').length;
                const total = Object.keys(extractedData).length;

                renderPreview(extractedData);
                showStatus(`✅ ${camposOK}/${total} campos extraídos correctamente`, 
                    camposOK === total ? 'success' : 'info');
                preview.style.display = 'block';
                preview.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                console.error(err);
                showStatus('Error al procesar: ' + err.message, 'error');
            } finally {
                convertBtn.disabled = false;
                convertBtn.textContent = '🔍 Extraer datos';
            }
        }

        // ============ VISTA PREVIA ============
        function renderPreview(datos) {
            const headers = Object.keys(datos);
            
            let html = '<thead><tr>';
            headers.forEach(h => html += `<th>${escapeHtml(h)}</th>`);
            html += '</tr></thead><tbody><tr>';
            headers.forEach(h => {
                const valor = datos[h];
                if (valor && valor.trim() !== '') {
                    html += `<td>${escapeHtml(valor)}</td>`;
                } else {
                    html += `<td><span class="missing">—</span></td>`;
                }
            });
            html += '</tr></tbody>';
            
            previewTable.innerHTML = html;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // ============ DESCARGA EXCEL ============
        function downloadExcel() {
            if (!extractedData) return;
            
            const ws = XLSX.utils.json_to_sheet([extractedData], {
                header: Object.keys(extractedData)
            });
            
            ws['!cols'] = Object.keys(extractedData).map(key => ({
                wch: Math.max(key.length + 2, 15)
            }));

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'HC');
            
            const doc = extractedData['NUMERO DE DOCUMENTO'] || Date.now();
            const fecha = extractedData['FECHA']?.replace(/\//g, '-') || '';
            XLSX.writeFile(wb, `HC_${doc}_${fecha}.xlsx`);
            showStatus('✅ Excel descargado', 'success');
        }

        // ============ COPIAR ============
        async function copyToClipboard() {
            if (!extractedData) return;
            
            try {
                const headers = Object.keys(extractedData);
                const values = headers.map(h => extractedData[h] || '');
                
                const texto = headers.join('\t') + '\n' + values.join('\t');
                
                await navigator.clipboard.writeText(texto);
                showStatus('✅ Fila copiada. Pega en Excel con Ctrl+V', 'success');
            } catch (err) {
                showStatus('Error al copiar: ' + err.message, 'error');
            }
        }

        // ============ UTILIDAD ============
        function showStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + type;
        }
    </script>
</body>
</html>
